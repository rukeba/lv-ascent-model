# Pitch-programme parameters that place Ariane 62 on a circular orbit of the
# given altitude - one set per programme and altitude, 6 in all, at 400, 500
# and 600 km. This file is Ariane 62 and nothing else: the catalogue is kept as
# one file a vehicle, and a command that wants the whole of it reads the
# directory.
#
# Every set was searched for rather than solved for, with every parameter of
# its family free. `tolerance` is what the set was accepted under and `reached`
# is what it does; instants are whole tenths of a second and the coefficients
# of the guidance law are written to full precision.
# See docs/catalogue.md
#
# WHAT IS NOT HERE, AND WHAT IS HERE ON OTHER TERMS.
#
# Not one node came out on an orbit at all - flown again with the altitude
# screen off, and the answer was the same. This is the family and the vehicle,
# not the search:
#   five-phase at 400 km, at 500 km, at 600 km
#
# All three bilinear tangents are here on terms the rest of the catalogue is
# not, and they are not alike. The family will not close to half a kilometre on
# this vehicle and it is the search that gives out rather than the vehicle. All
# three were searched with `start` at 17 values, `middle` at 23 and thirty
# valleys followed, and all three finish at five steps a second rather than ten
# - which `simulation` records, because a set is found against a model.
#   500 km closes to 5 m and is filed at half a kilometre, as the rest
#   400 km is 1.3 km out and is asked for two and a half
#   600 km is 17.6 km out with the speed 14 m/s out, and is asked for 20 and 15
# See docs/catalogue-gaps.md
#
#     ascent a62 --list
#     ascent a62 --altitude 400 --programme velocity-share
#     ascent-search a62 --altitude 400 --programme vs --yaml   # what wrote one
missions:
  - vehicle: lv.a62
    target_altitude: 400_000
    launch_site: {latitude: 5.2, azimuth: 90}
    pitch_programme: {type: velocity-share, t1: 22.0, tf: 681.2455627441407, te: 1098.9, s: -2.12841796875}
    cutoff: {type: time, time: 1098.9}
    simulation: {duration: 1159, steps_per_second: 10}
    tolerance: {orbit_km: 0.5, speed_ms: 10}
    reached: {perigee_km: 399.98, apogee_km: 399.98, gravity_loss: 2878.9, aerodynamic_loss: 164.9, steering_loss: 932.5, total_loss: 3976.2}

  - vehicle: lv.a62
    target_altitude: 400_000
    launch_site: {latitude: 5.2, azimuth: 90}
    pitch_programme: {type: bilinear-tangent, t1: 17.2, a: -0.007447168728564076, b: 7.521640415849717, c: 0.06962617446412135, te: 1027.2}
    cutoff: {type: time, time: 1027.2}
    simulation: {duration: 1087, steps_per_second: 5}
    tolerance: {orbit_km: 2.5, speed_ms: 10}
    reached: {perigee_km: 398.72, apogee_km: 400.00, gravity_loss: 2217.8, aerodynamic_loss: 226.9, steering_loss: 667.5, total_loss: 3112.1}

