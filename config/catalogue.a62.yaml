# Pitch-programme parameters that place Ariane 62 on a circular orbit of
# the given altitude - one set per programme and altitude, 5 in all,
# at 400, 500, 600 km. This file is Ariane 62 and nothing else:
# the catalogue is kept as one file a vehicle, and a command that wants the
# whole of it reads the directory.
#
# Every set here was searched for rather than solved for, and searched with
# every parameter of its family free: `ascent-search` sweeps a grid over the
# whole family, closes in on the best node ten times over, and ranks what it
# finds by how far the orbit reached is from the circle asked for. Nothing is
# held behind the search's back - not the vertical rise, not the five-phase
# k2, not the instant the bilinear tangent's middle angle is prescribed at.
# An entry is the head of that ranking.
#
# A set counts as reaching the orbit when the perigee, the apogee and the
# altitude at cut-off are all inside the tolerance it was asked for and the
# inertial speed at cut-off is inside the tolerance on that. Both are written on
# the entry, in `tolerance`, because they are not the same for all of them: the
# orbit is half a kilometre nearly everywhere and two and a half on Ariane 62's
# bilinear tangent, where half will not close and a set two kilometres out is
# worth more than a blank. So `reached` does not read the target back twice over
# the way a root find would leave it - it reads what the search actually landed
# on, inside whatever the entry beside it says it was held to.
#
# Every instant is a whole tenth of a second - the vertical rise, the end of
# the programme and the cut-off - because that is the finest a timeline is ever
# issued to, and an answer written finer is the same answer with digits after
# it that nothing can act on. The coefficients of the guidance law are not
# instants and nothing rounds them: they are written to full precision because
# they have to be. Near a circular orbit the apogee answers to the cut-off at
# some 80 km per second, and the bilinear tangent is more delicate still - its
# numerator a*tau + b cancels to almost nothing at the end of the turn, which
# is what levels the vehicle out, so the last digits of a and b carry the
# terminal angle and rounding them moves the perigee by a kilometre. With the
# cut-off held to a tenth, it is the shape of the turn that places the orbit.
#
# An entry is an ordinary mission specification with one block added: `reached`
# records the orbit it produces and what it costs, so any entry can be checked
# without repeating the search. tests/test_catalogue.py flies all of them.
#
# WHAT IS NOT HERE, and what is here on other terms.
#
# Not one node of the grid came out on an orbit at all - not an open
# trajectory that nearly closed, but no orbit anywhere in the family. Flown
# again with the altitude screen off, so that every node was integrated rather
# than dropped on the estimate, and the answer was the same. This is the family
# and the vehicle, not the search:
#   five-phase at 400 km
#   five-phase at 500 km
#   five-phase at 600 km
#
# The bilinear tangent at 600 km. An orbit is there and the search does not land
# on it: what comes back has one apsis exact to ten metres and the other
# seventeen kilometres away, and the speed at cut-off is 14 m/s out, which is
# what a coordinate-wise descent looks like when it has walked into the wrong
# valley. That it is the search and not the vehicle is measured rather than
# supposed. Following five valleys instead of one recovers this same family at
# 400 km on Falcon 9 and at 1100 on H3; here five leave the 400 km case 39,992 m
# out and twenty leave it 39,471 m at three times the cost, so the count of
# valleys is not what is short. The sweep's resolution on the two angle axes is:
# `start` walks ten degrees in nine values while every answer for a vehicle that
# burns for a thousand seconds sits in the top degree of it, which puts two
# nodes where the whole answer lives:
#   bilinear-tangent at 600 km - closest 17.6 km out
#
# THE OTHER TWO BILINEAR TANGENTS ARE WHAT THAT FINER SWEEP FOUND, and they are
# not alike. Both were searched with `start` at 17 values and the middle angle
# at 23, with thirty valleys followed, and both were flown at five steps a
# second rather than ten - which is recorded in `simulation`, because a set is
# found against a model and the step is part of which model. Across the whole
# catalogue the two steps differ by at most 3 m of apsis, and what the coarser
# one buys is half the cost of a search that takes an hour and a half a set.
#
# The 500 km set closes the orbit to 5 m. It is filed on the same terms as
# everything else in this catalogue, at half a kilometre, and the only thing
# remarkable about it is where it came from: the default grid left this very
# case 114 km out. Where the sweep can see the answer at all, the passes land on
# it exactly.
#
# The 400 km set is 1.3 km out and is asked for two and a half, which is the
# only entry in the catalogue held to anything but half. It is here rather than
# left out because a set a kilometre from the circle is a set a vehicle could
# fly, and because what it fills is a statement about this family on this
# vehicle that a blank line cannot make. What it is not is a set that meets the
# condition the rest of the file meets - and that is why every entry carries the
# tolerance it was accepted at.
#
#     ascent a62 --list
#     ascent a62 --altitude 400 --programme velocity-share
#     ascent-search a62 --altitude 400 --programme vs --yaml   # what wrote one

missions:
  - vehicle: lv.a62
    target_altitude: 400_000
    launch_site: {latitude: 5.2, azimuth: 90}
    pitch_programme: {type: velocity-share, t1: 22.0, tf: 681.2455627441407, te: 1098.9, s: -2.12841796875}
    cutoff: {type: time, time: 1098.9}
    simulation: {duration: 1159, steps_per_second: 10}
    tolerance: {orbit_km: 0.5, speed_ms: 10}
    reached: {perigee_km: 399.98, apogee_km: 399.98, gravity_loss: 2878.9, aerodynamic_loss: 164.9, steering_loss: 932.5, total_loss: 3976.2}

  - vehicle: lv.a62
