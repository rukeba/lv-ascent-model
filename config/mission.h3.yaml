# H3-22S into a 1200 km circular orbit from Tanegashima, on the five-phase
# programme, which here ends just before cut-off.
# See docs/configuration.md
vehicle: lv.h3

target_altitude: 1_200_000

launch_site:
  name: Tanegashima Space Center LA-Y, Japan
  latitude: 30.4
  azimuth: 90

pitch_programme:
  type: five-phase
  t1: 20.0
  t4: 706.1400732
  k2: 0.103230
  k3: 0.611817005

cutoff:
  type: time
  time: 706.8400732

simulation:
  duration: 1100
  steps_per_second: 10
