# Pitch-programme parameters that place each vehicle on a circular orbit of the
# given altitude - one set per vehicle, programme and altitude.
#
# Each set is defined by its terminal condition: the perigee and the apogee
# both meet the target altitude. The vertical rise t1 is held at 20 s and the
# programme ends at cut-off.
#
# The five-phase turn holds k2 at 0.05 as well - the share of the turn spent
# building the pitch rate up. Minimising the loss drives that share to zero,
# which is a step in pitch rate and defeats the point of the phase, so it is a
# design choice rather than something the terminal condition can settle. What
# is left is k3 and the cut-off time: two unknowns for two conditions, so each
# five-phase set is a root find with nothing free left over. The other two
# programmes keep a third parameter, and among the sets that meet the condition
# the search preferred the smaller steering loss.
#
# The numbers are written to full precision because they have to be. Near a
# circular orbit the apogee answers to the cut-off time at some 80 km per
# second, so a set rounded to hundredths of a second would not reproduce the
# orbit it is filed against. The bilinear tangent is more delicate still: its
# numerator a*tau + b cancels to almost nothing at the end of the turn, which
# is what levels the vehicle out, so the last digits of a and b carry the
# terminal angle and rounding them moves the perigee by a kilometre.
#
# An entry is an ordinary mission specification with one block added: `reached`
# records the orbit it produces and what it costs, so any entry can be checked
# without repeating the search. tests/test_catalogue.py checks all of them.
#
# The Ariane 62 and H3 sets were solved again once those two vehicles stopped
# carrying their core stage twice over. The search behind them was not repeated:
# each of those sets is the smallest move away from the set it replaces that
# meets the terminal condition again, so it holds the shape that search chose
# without being the smallest steering loss all over again. The Falcon 9 vehicle
# file never had the fault, and fifteen of its seventeen sets are as they were.
# The other two - the bilinear tangents at 400 and 450 km - were solved again for
# the reason given below.
#
# One caveat on the H3 sets. The steering loss prices the thrust deflection that
# holding a programme would take, as the sine of that deflection, and where that
# sine passes one there is no such deflection: the thrust cannot hold the
# programme, and the price saturates at the whole of it. H3's second stage runs
# at some 4.6 m/s^2 and has to finish its turn at over 4 km/s, so it saturates
# over 16 to 54 per cent of the burn at every altitude here - which means its
# steering loss cannot be used to rank one programme against another. Its
# trajectory and the orbit it reaches do not depend on that figure and are
# unaffected. Ariane 62 stays well under throughout, and `ascent <mission>`
# reports the peak demand and the saturated share for any run.
#
# Falcon 9 stays under too, and that is what moved its two bilinear sets. Both
# asked for a peak of 1.027 and stood on the clamp over half a per cent of the
# burn; the family has a parameter to spare, and a smaller c takes them to 0.93
# and 0.94 with nothing saturated - and with a smaller steering loss, which is
# what the rule here prefers anyway. The five-phase set at 450 km peaks at 1.053
# and has nothing to spare, k3 and the cut-off both answering to the two
# conditions while k2 is held across the block, so it stands as it is.
#
# The gaps are properties of the programmes and of the vehicles rather than
# unfinished work. Ariane 62 gives out a little above 900 km: by the cut-off its
# upper stage has all but run dry, and no programme here closes a circular orbit
# at 1000 km. The velocity-share quartic gives out a hundred kilometres earlier
# still, as it does at 600 km on Falcon 9. The five-phase turn covers only the
# middle of each range, because with k2 fixed it has no freedom left to stretch
# to the ends, and it places no orbit at all for Ariane 62, whose turn would
# have to be one continuous manoeuvre while the vehicle spends its last several
# hundred seconds on a low-thrust upper stage. A wide random search over each
# family found nothing for those, so they are left out rather than filled in
# with sets that miss.
#
#     ascent f9 --list
#     ascent f9 --altitude 650 --programme bilinear-tangent

missions:
