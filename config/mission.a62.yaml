# Ariane 62 into an 800 km circular orbit from Kourou, flying a bilinear
# tangent programme.
vehicle: lv.a62

target_altitude: 800_000

launch_site:
  name: Guiana Space Centre ELA-4, Kourou
  latitude: 5.2
  azimuth: 90

pitch_programme:
  type: bilinear-tangent
  t1: 25.0
  a: -0.3933656045
  b: 455.2196469
  c: 1.637422733
  te: 1182.243139

cutoff:
  type: time
  time: 1182.243139

simulation:
  duration: 1250
  steps_per_second: 10
