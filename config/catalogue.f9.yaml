# Pitch-programme parameters that place Falcon 9 on a circular orbit of the
# given altitude - one set per programme and altitude, 19 in all, at 400 to
# 700 km every fifty. This file is Falcon 9 and nothing else: the catalogue is
# kept as one file a vehicle, and a command that wants the whole of it reads
# the directory.
#
# Every set was searched for rather than solved for, with every parameter of
# its family free. `tolerance` is what the set was accepted under and `reached`
# is what it does; most of this file is held to a kilometre, which is the box
# section 4.4 of the dissertation compares against and what two of the three
# families need to close at all. Instants are whole tenths of a second and the
# coefficients of the guidance law are written to full precision.
# See docs/catalogue.md
#
# WHAT IS NOT HERE. The family reaches nothing near the orbit: thousands of
# nodes were dropped by the altitude integral, and the handful that were flown
# came out on an ellipse with both apsides wrong.
#   velocity-share at 650 km - closest 34.7 km out
#   velocity-share at 700 km - closest 1668.8 km out
# See docs/catalogue-gaps.md
#
#     ascent f9 --list
#     ascent f9 --altitude 400 --programme velocity-share
#     ascent-search f9 --altitude 400 --programme vs --yaml   # what wrote one
missions:
  - vehicle: lv.f9
    target_altitude: 400_000
    launch_site: {latitude: 28.5, azimuth: 90}
    pitch_programme: {type: five-phase, t1: 13.1, t4: 495.4, k2: 0.05875, k3: 0.01171875}
    cutoff: {type: time, time: 495.4}
    simulation: {duration: 555, steps_per_second: 10}
    tolerance: {orbit_km: 1.0, speed_ms: 10}
    reached: {perigee_km: 399.64, apogee_km: 400.99, gravity_loss: 2200.4, aerodynamic_loss: 30.1, steering_loss: 291.8, total_loss: 2522.3}

