[project]
name = "lv-ascent-model"
version = "1.0.0"
description = "Two-dimensional ascent model of a launch vehicle with parametric pitch programmes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ruslan Keba", email = "phd@kebamail.com" }]
keywords = ["launch vehicle", "ascent trajectory", "pitch programme", "astrodynamics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.scripts]
ascent = "ascent.cli:main"
ascent-search = "ascent.cli:search_main"

[project.urls]
Repository = "https://github.com/rukeba/lv-ascent-model"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ascent"]
